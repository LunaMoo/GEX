name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases for version tags

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build (Release x64)
        run: msbuild GEX.sln /m /p:Configuration=Release /p:Platform=x64

      - uses: actions/upload-artifact@v4
        with:
          name: GEX-win-x64
          path: |
            bin/Release/GEX.exe
            README.md
            LICENSE

      - name: Package release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path bin/Release/GEX.exe, README.md, LICENSE -DestinationPath "GEX-${{ github.ref_name }}-win-x64.zip"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GEX-*-win-x64.zip
          generate_release_notes: true
