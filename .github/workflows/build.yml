name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  release:
    types: [ published ]   # publishing a release on GitHub builds GEX.exe and attaches it

permissions:
  contents: write   # needed to upload the release asset

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build (Release x64)
        run: msbuild GEX.sln /m /p:Configuration=Release /p:Platform=x64

      - uses: actions/upload-artifact@v4
        with:
          name: GEX-win-x64
          path: |
            bin/Release/GEX.exe
            README.md
            LICENSE

      - name: Package release
        if: github.event_name == 'release'
        shell: pwsh
        run: Compress-Archive -Path bin/Release/GEX.exe, README.md, LICENSE -DestinationPath "GEX-${{ github.event.release.tag_name }}-win-x64.zip"

      - name: Publish release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: GEX-*-win-x64.zip
